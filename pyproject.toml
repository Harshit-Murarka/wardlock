[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wardlock"
version = "0.1.0"
description = "A money gate that lets an AI support agent refund PayPal customers safely (sandbox only)."
requires-python = ">=3.11"
dependencies = [
    # Lower bounds = the versions the test suite runs on; upper bounds stop a new major
    # version from changing behaviour under a deploy (Render installs fresh each build).
    "fastapi>=0.142,<1",
    "uvicorn>=0.54,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy>=2.1,<2.2",
    "mcp>=2.3,<3",  # the 2.x API (MCPServer, streamable HTTP); 1.x is not compatible
    "python-dotenv>=1.2,<2",
    "pyyaml>=6,<7",  # policy.yaml (SPEC §5)
    "psycopg[binary]>=3.3,<4",  # Postgres on Render (P11); unused with SQLite
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
include = ["wardlock*", "demo_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
