# Wardlock policy (see docs/SPEC.md §5). Changes here are recorded with every decision.
version: 1
currency: USD                 # the currency auto_approve_limit is in; other currencies are always held
auto_approve_limit: "50.00"   # keep the quotes: an unquoted 50.00 is a YAML float and is rejected
max_refunds_per_session: 2
goodwill_percentages: [10, 25]
reason_allows:
  DAMAGED:       [LINE_ITEM, GOODWILL_PCT]
  WRONG_ITEM:    [LINE_ITEM, SHIPPING]
  NOT_RECEIVED:  [FULL_REMAINING]
  LATE_DELIVERY: [SHIPPING, GOODWILL_PCT]
  GOODWILL:      [GOODWILL_PCT]
