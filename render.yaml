# Render Blueprint (P11): one web service (API + MCP + webhooks + the built console) and Postgres.
# Deploy: Render dashboard -> New -> Blueprint -> this repo. Values marked `sync: false` are
# asked for in the dashboard and never stored in git. Sandbox only (ALLOW_LIVE stays 0).
services:
  - type: web
    name: wardlock
    runtime: python
    plan: free
    # Render's Python build image ships Node.js, so the console builds here (confirmed Nov 9, 2026).
    buildCommand: pip install . && npm ci --prefix console && npm run build --prefix console
    startCommand: uvicorn wardlock.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        fromDatabase:
          name: wardlock-db
          property: connectionString
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: ALLOW_LIVE
        value: "0"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: models/gemini-2.5-flash
      - key: WARDLOCK_SERVICE_KEY
        generateValue: true
      - key: WARDLOCK_ADMIN_PASSWORD
        sync: false
      # Your Render host, e.g. ["wardlock.onrender.com"] and ["https://wardlock.onrender.com"].
      - key: MCP_ALLOWED_HOSTS
        sync: false
      - key: MCP_ALLOWED_ORIGINS
        sync: false
      - key: SESSION_TTL_MINUTES
        value: "30"
      - key: HOLD_TIMEOUT_MINUTES
        value: "15"

databases:
  - name: wardlock-db
    plan: free
